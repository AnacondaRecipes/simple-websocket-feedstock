{% set name = "simple-websocket" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 7939234e7aa067c534abdab3a9ed933ec9ce4691b0713c78acb195560aa52ae4

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<36]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=61.2
  run:
    - python
    - wsproto

test:
  source_files:
    - tests
  imports:
    - simple_websocket
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests
  requires:
    - pip
    - pytest

about:
  home: https://github.com/miguelgrinberg/simple-websocket
  summary: Simple WebSocket server and client for Python.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: Simple WebSocket server and client for Python.
  doc_url: https://simple-websocket.readthedocs.io
  dev_url: https://github.com/miguelgrinberg/simple-websocket

extra:
  recipe-maintainers:
    - woutdenolf
